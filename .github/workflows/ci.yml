name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # New files in supabase/migrations reach the production database after tests pass.
  # Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; skipped without them.
  migrations:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: supabase-migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: akzftjrkfsfvcrtbsofk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Skip without credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets are not set; migrations were not applied."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Refuse to replay the hand-applied history
        if: steps.creds.outputs.ready == 'true'
        run: |
          plan=$(npx supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1)
          echo "$plan"
          if echo "$plan" | grep -q "20260521212541_schema"; then
            echo "::error::The database has no migration history yet. Run 'npm run db:baseline' once (see README)."
            exit 1
          fi
      - if: steps.creds.outputs.ready == 'true'
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
