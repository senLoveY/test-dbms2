name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ensure-pages-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Pages uses GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: "workflow"
              });
              core.info("Pages build_type set to workflow");
            } catch (error) {
              core.warning(`Unable to set Pages build_type automatically: ${error.message}`);
            }

  build:
    runs-on: ubuntu-latest
    needs: ensure-pages-workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
